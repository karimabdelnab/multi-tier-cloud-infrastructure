
services:
  app:
    build: ./app
    container_name: cloud-app
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cloud_db
      DB_USER: cloud_user
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloud-network

  nginx:
    image: nginx:alpine
    container_name: cloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cloud-network

  db:
    image: postgres:17-alpine
    container_name: cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_db
      POSTGRES_USER: cloud_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_user -d cloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloud-network

volumes:
  postgres_data:
    name: multi-tier-cloud-infrastructure_postgres_data
    external: true

networks:
  cloud-network:
    name: multi-tier-cloud-infrastructure_cloud-network
    external: true
